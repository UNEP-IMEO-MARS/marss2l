name: marss2lpy312
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # only for vm
  # - notebook
  - ipykernel
  - pip:
    - torch
    - torchvision
    - pandas>=2.0
    - geopandas>=0.13
    - rasterio
    - shapely
    - fsspec
    - adlfs
    - earthengine-api
    - segmentation_models_pytorch
    - georeader-spaceml>=1.5.9
    # Optional dependency of georeader; reflectance.compute_sza raises ImportError
    # without it, and marss2l.solar_geometry needs it.
    - pysolar
    - marshsi>=0.1.1
    - cloudsen12-models
    - matplotlib
    - matplotlib-scalebar
    - folium
    - tqdm
    - scipy
    - scikit-image
    - scikit-learn
    - satalign==0.1.1
    - wandb
    - torchmetrics
    - seaborn
    - basemap
    - numpy
    - xarray
    - netcdf4
    - huggingface_hub[cli,torch]
    - cyclopts
    - loguru
    - openpyxl