[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marss2l"
# Read version from __init__.py
dynamic = ["version"]
authors = [
    {name = "Gonzalo Mateo-García"},
    {name = "Anna Vaughan"},
]
description = "MARS-S2L Plume detection, segmentation and quantification of methane plumes in Sentinel-2 and Landsat images"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ch4", "methane", "remote sensing"]
license = "LGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "pandas>=2.0",
    "geopandas>=0.13",
    "fsspec",
    "adlfs",
    "earthengine-api",
    "segmentation_models_pytorch",
    "georeader-spaceml>=1.5.9",
    "marshsi>=0.1.1",
    "matplotlib",
    "matplotlib-scalebar",
    "folium",
    "tqdm",
    "scipy",
    "seaborn",
    "scikit-image",
    "satalign==0.1.1",
    "wandb",
    "torchmetrics",
    "scikit-learn",
    "huggingface_hub[cli,torch]",
    "xarray",
    "netcdf4",
    "rasterio",
    "shapely",
    "cloudsen12-models",
    "cyclopts",
    "loguru",
]

[project.optional-dependencies]
# Test-only tools. Runtime deps come from `dependencies` above; the fully-pinned
# CI lock (environment/requirements-test.lock) is generated from both via `make lock`.
test = [
    "pytest",
    "pytest-cov",
    "nbmake",
    "ipykernel",
    "pre-commit",
    # `mpl_toolkits.basemap` (used by some figure notebooks) ships in the
    # `basemap` PyPI package. Dev/test-only — the runtime package imports it
    # lazily inside the plotting helper, so it stays out of `dependencies`.
    "basemap",
    # `cartopy` — used by `marss2l.plot.map_ch4_background` (imported lazily) and
    # exercised by the figure notebooks. Dev/test-only, same rationale as `basemap`.
    "cartopy",
]

[project.urls]
"Homepage" = "https://github.com/UNEP-IMEO-MARS/marss2l"
"Bug Tracker" = "https://github.com/UNEP-IMEO-MARS/marss2l/issues"

[tool.setuptools]
packages = {find = {where = ["."], include = ["marss2l*"]}}

[tool.setuptools.package-data]
marss2l = ["py.typed", "mars_sentinel2/integrated_transmittances.json"]

[tool.setuptools.exclude-package-data]
"*" = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "marss2l.__version__"}

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that need real external data/credentials (notebooks, train_final); triggered by the 'integration' PR label, not run on the default unit-test job.",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
fix = true
cache-dir = "~/.cache/ruff"
exclude = ["notebooks/",]
line-length = 100
src = ["marss2l"]
target-version = "py312"

[tool.ruff.lint]
dummy-variable-rgx = "^_$"
select = [
    "F",
    "E",
    "W",
    "YTT",
    "B",
    "Q",
    "PLE",
    "PLR",
    "PLW",
    "PIE",
    "PYI",
    "TID",
    "ISC",
    "F821",
]
ignore = [
    "B008",
    "F841",
    "PLR0911",
    "E402",
    "E731",
    "E501",
    "S303",
    "S307",
    "RET504",
    "S101",
    "F722",
    "PLR2004",
    "PLR0913",
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.isort]
atomic = "true"
line_length = 100
multi_line_output = 3
profile = "black"
py_version = 312
skip = 'notebooks'