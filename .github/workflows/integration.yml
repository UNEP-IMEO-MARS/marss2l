name: Integration Tests

# Integration tests exercise the notebooks and the train_final script against
# the real MARS-S2L Hugging Face dataset and external services. They are NOT
# run on every PR: add the 'integration' label to a PR to trigger them (or run
# the workflow manually). This workflow is intentionally not a required check
# for merging.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Run Integration Tests
    # Run only when the PR carries the 'integration' label, or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    # Credentials come exclusively from the environment (see marss2l/config.py).
    # Tests that need them are skipped when the corresponding secret is unset.
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements-test.lock
          pip install -e . --no-deps

      - name: Run train_final integration test
        run: pytest tests/ -v -m integration

      - name: Register notebook test kernel
        run: |
          python -m ipykernel install --user --name marss2l-ci --display-name "Python (marss2l-ci)"

      - name: Run notebook integration tests
        run: |
          pytest --nbmake --nbmake-timeout=600 --nbmake-kernel=marss2l-ci -v \
            notebooks/examples/plot_images_dataset_train.ipynb \
            notebooks/examples/plot_plumes_dataset_test.ipynb \
            notebooks/examples/run_inference.ipynb \
            notebooks/examples/download_and_inference.ipynb \
            notebooks/figures/dataset_stats_by_split_and_geopackage_locations.ipynb \
            notebooks/figures/figure_number_of_images_per_country.ipynb \
            notebooks/figures/mdl_exploration_by_case_study.ipynb \
            notebooks/figures/mdl_exploration_adapted.ipynb \
            notebooks/figures/figure_wind_speed.ipynb \
            notebooks/figures/stats_dataset_toareflectances.ipynb \
            notebooks/figures/eval_model_and_figure_prob_vs_emission_rate.ipynb \
            notebooks/figures/figure_controlled_releases.ipynb \
            notebooks/figures/cloudsen12_experiment.ipynb \
            notebooks/figures/ablation_threshold_pixels.ipynb
