name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements-test.lock
          pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -v

      - name: Register notebook test kernel
        run: |
          python -m ipykernel install --user --name marss2l-ci --display-name "Python (marss2l-ci)"

      - name: Run notebook integration test (train dataloader)
        run: |
          pytest --nbmake --nbmake-timeout=600 --nbmake-kernel=marss2l-ci \
            notebooks/examples/plot_images_dataset_train.ipynb -v
