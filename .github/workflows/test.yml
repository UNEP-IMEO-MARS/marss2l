name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements-test.lock
          pip install -e . --no-deps

      - name: Run unit tests
        # Integration tests (notebooks, train_final) run in integration.yml,
        # gated on the 'integration' PR label.
        run: pytest tests/ -v -m "not integration"
